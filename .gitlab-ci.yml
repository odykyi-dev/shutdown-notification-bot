stages:
  - lint
  - type_check
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# ==========================================
# 1. LINTING JOB
# ==========================================
lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt flake8 black
  script:
    - flake8 . --count --config=.flake8 --max-complexity=10 --max-line-length=120 --statistics
    - black --check .

# ==========================================
# 2. TYPE CHECKING JOB
# ==========================================
type_check:
  stage: type_check
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt mypy
  script:
    - PYTHONPATH=src mypy --install-types --non-interactive --explicit-package-bases .

# ==========================================
# 3. UNIT TESTING JOB
# ==========================================
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt pytest
  script:
    - export PYTHONPATH=src
    - pytest

# ==========================================
# 4. DEPLOYMENT JOB
# ==========================================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p 22 $SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Connect to Raspberry Pi and execute the deployment script
    - ssh -p 22 $SSH_USER@$SSH_HOST "bash -s" < deploy.sh
  only:
    - tags
